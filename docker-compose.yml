# Docker Compose - Run your MCP server stack
# Usage: docker-compose up -d

services:
  # Your MCP Server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: personal-mcp-server
    restart: unless-stopped
    
    # Port mapping: host:container (both 3000 - industry standard)
    ports:
      - "3000:3000"
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Override MongoDB URI to use Docker service name
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/pulse
    
    # Wait for MongoDB to be healthy before starting
    depends_on:
      mongodb:
        condition: service_healthy
    
    networks:
      - mcp-network
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: mcp-mongodb
    restart: unless-stopped
    
    # Reduce MongoDB log verbosity
    command: mongod --quiet --logpath /dev/null
    
    # Persistent storage
    volumes:
      - mongodb-data:/data/db
    
    networks:
      - mcp-network
    
    # Health check for MongoDB
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Persistent volumes
volumes:
  mongodb-data:
    driver: local

# Network
networks:
  mcp-network:
    driver: bridge
